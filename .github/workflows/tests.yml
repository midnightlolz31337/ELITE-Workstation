name: Workstation local integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out Workstation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned Ingestion Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: midnightlolz31337/ELITE-Ingestion-Core
          ref: e7ff07339a3b5256cca0e983f03ccc579b6cfdeb
          path: integration/ELITE-Ingestion-Core
      - name: Check out pinned Protocol adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: midnightlolz31337/ELITE-Protocol
          ref: 5f8339d926fe0c5cb0b380d324795eebcd2cabac
          path: integration/ELITE-Protocol
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Protocol validation dependencies
        run: python -m pip install --requirement integration/ELITE-Protocol/requirements.txt
      - name: Compile Workstation
        run: python -m compileall -q elite_workstation
      - name: Run local integration tests
        env:
          ELITE_INGESTION_CORE_PATH: integration/ELITE-Ingestion-Core
          ELITE_PROTOCOL_PATH: integration/ELITE-Protocol
        run: python -m unittest discover -s tests -v
